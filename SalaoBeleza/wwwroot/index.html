<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Salão de Beleza</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

    <h1>Salão de Beleza</h1>

    <h2>Cadastrar cliente</h2>

    <input type="text" id="nome" placeholder="Nome">
    <input type="text" id="telefone" placeholder="Telefone">
    <input type="email" id="email" placeholder="Email">
    <input type="password" id="senha" placeholder="Senha">
    <input type="text" id="cpf" placeholder="CPF">

    <button onclick="cadastrarCliente()">Cadastrar</button>


    <h2>Clientes cadastrados</h2>

    <button onclick="carregarClientes()">Atualizar lista</button>

    <table>

        <thead>
            <tr>
                <th>Id</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Email</th>
                <th>CPF</th>
            </tr>
        </thead>

        <tbody id="listaClientes"></tbody>

    </table>


    <script>

        const API = "/api/clientes";

        async function cadastrarCliente() {

            const nome = document.getElementById("nome").value.trim();
            const telefone = document.getElementById("telefone").value.trim();
            const email = document.getElementById("email").value.trim();
            const senha = document.getElementById("senha").value;
            const cpf = document.getElementById("cpf").value.trim();

            const nomeValido = /^[A-Za-zÀ-ÿ\s]+$/;

            if (nome === "") {

                alert("Digite o nome do cliente!");

                return;
            }

            if (!nomeValido.test(nome)) {

                alert(
                    "O nome deve conter apenas letras e espaços. " +
                    "Não pode conter números."
                );

                return;
            }

            if (!/^\d+$/.test(telefone)) {

                alert("O telefone deve conter apenas números.");

                return;
            }

            if (telefone.length < 6) {

                alert("O telefone deve ter no mínimo 6 números.");

                return;
            }

            if (cpf.length < 14) {

                alert("O CPF deve ter no mínimo 14 caracteres.");

                return;
            }

            if (!email.includes("@") || !email.includes(".")) {

                alert("Digite um email válido contendo @ e .");

                return;
            }

            try {

                const resposta = await fetch(API, {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({
                        nome: nome,
                        telefone: telefone,
                        email: email,
                        senha: senha,
                        cpf: cpf
                    })

                });
                if (!resposta.ok) {

                    const erro = await resposta.text();

                    console.error("STATUS:", resposta.status);
                    console.error("ERRO DO SERVIDOR:", erro);

                    alert(
                        "Erro ao cadastrar cliente!\n\n" +
                        "Código: " + resposta.status + "\n\n" +
                        "Detalhes: " + erro
                    );

                    return;
                }

                alert("Cliente cadastrado com sucesso!");

                document.getElementById("nome").value = "";
                document.getElementById("telefone").value = "";
                document.getElementById("email").value = "";
                document.getElementById("senha").value = "";
                document.getElementById("cpf").value = "";

            }

            catch (erro) {

                console.error("Erro:", erro);

                alert(
                    "Não foi possível conectar com o servidor."
                );

            }

        }

        async function carregarClientes() {

            try {

                const resposta = await fetch(API);

                if (!resposta.ok) {

                    const erro = await resposta.text();

                    console.error(
                        "STATUS:",
                        resposta.status
                    );

                    console.error(
                        "ERRO DO SERVIDOR:",
                        erro
                    );

                    alert(
                        "Erro ao carregar clientes!\n\n" +
                        "Código: " + resposta.status + "\n\n" +
                        "Detalhes: " + erro
                    );

                    return;
                }

                const clientes = await resposta.json();

                console.log(
                    "Clientes recebidos:",
                    clientes
                );

                const tabela =
                    document.getElementById("listaClientes");

                tabela.innerHTML = "";

                clientes.forEach(cliente => {

                    const linha =
                        document.createElement("tr");

                  linha.innerHTML = `
                        <td>${cliente.id}</td>
                        <td>${cliente.nome}</td>
                        <td>${cliente.telefone}</td>
                        <td>${cliente.email}</td>
                        <td>${cliente.cpf}</td>
                    `;
                    tabela.appendChild(linha);

                });

                if (clientes.length === 0) {

                    tabela.innerHTML = `
                        <tr>
                            <td colspan="5">
                                Nenhum cliente cadastrado.
                            </td>
                        </tr>
                    `;
                }
            }
            catch (erro) {
                console.error(
                    "Erro ao carregar clientes:",
                    erro
                );
                alert(
                    "Não foi possível carregar os clientes."
                );
            }
        }
    </script>

</body>

</html>
