<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Criar Conta - Belleza</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;

            font-family: Georgia, "Times New Roman", serif;

            background:
                linear-gradient(
                    rgba(60, 50, 48, 0.40),
                    rgba(60, 50, 48, 0.40)
                ),
                url("imagens/salao_belleza.png");

            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* ==============================
           CARD
        ============================== */

        .cadastro-card {
            width: 445px;

            background: rgba(255, 255, 255, 0.97);

            border-radius: 7px;

            padding: 25px 33px 18px;

            box-shadow:
                0 10px 35px rgba(0, 0, 0, 0.20);
        }


        /* ==============================
           LOGO
        ============================== */

        .logo-area {
            text-align: center;
        }

        .logo {
            width: 65px;
            height: 65px;

            object-fit: contain;

            display: block;

            margin: 0 auto 2px;
        }

        .logo-area h1 {
            font-size: 29px;

            font-weight: normal;

            color: #352a27;

            margin: 0;
        }

        .subtitulo {
            font-size: 13px;

            color: #ce9997;

            letter-spacing: 0.5px;

            margin-top: 0;
        }


        /* ==============================
           LINHAS
        ============================== */

        .linha {
            width: 178px;

            height: 3px;

            margin: 4px auto 0;

            position: relative;
        }

        .linha::before,
        .linha::after {
            content: "";

            position: absolute;

            top: 0;

            width: 80px;

            height: 3px;

            background: #ce9997;
        }

        .linha::before {
            left: 0;
        }

        .linha::after {
            right: 0;
        }


        /* ==============================
           TÍTULO
        ============================== */

        .titulo {
            text-align: center;

            color: #ce9997;

            font-size: 16px;

            font-weight: normal;

            margin-top: 17px;
        }

        .descricao {
            text-align: center;

            color: #403734;

            font-size: 11px;

            margin-top: 17px;

            margin-bottom: 17px;
        }


        /* ==============================
           CAMPOS
        ============================== */

        .campo {
            margin-bottom: 19px;
        }

        .campo label {
            display: block;

            color: #403734;

            font-size: 12px;

            margin-bottom: 2px;
        }

        .campo input {
            width: 100%;

            height: 16px;

            border: 1px solid #8f8987;

            border-radius: 1px;

            background: white;

            padding: 1px 4px;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 11px;

            outline: none;
        }

        .campo input:focus {
            border-color: #ce9997;
        }

        .campo input::placeholder {
            color: #77716f;
        }


        /* ==============================
           LEMBRAR-ME
        ============================== */

        .lembrar {
            display: flex;

            align-items: center;

            gap: 4px;

            margin-top: -5px;

            margin-bottom: 17px;
        }

        .lembrar input {
            width: 11px;
            height: 11px;

            accent-color: #ce9997;
        }

        .lembrar label {
            font-size: 11px;

            color: #665956;
        }


        /* ==============================
           BOTÃO
        ============================== */

        .btn-criar {
            width: 100%;

            height: 19px;

            border: none;

            border-radius: 2px;

            background: #ce9997;

            color: white;

            font-family: Georgia, "Times New Roman", serif;

            font-size: 11px;

            cursor: pointer;
        }

        .btn-criar:hover {
            background: #b98583;
        }


        /* ==============================
           OU
        ============================== */

        .ou {
            text-align: center;

            color: #403734;

            font-size: 12px;

            margin: 13px 0;
        }


        /* ==============================
           LOGIN
        ============================== */

        .login-existente {
            text-align: center;

            font-size: 11px;

            color: #665956;
        }

        .login-existente a {
            color: #ce9997;

            text-decoration: none;
        }

        .login-existente a:hover {
            text-decoration: underline;
        }


        /* ==============================
           RESPONSIVIDADE
        ============================== */

        @media (max-width: 600px) {

            body {
                padding: 20px;
            }

            .cadastro-card {
                width: 100%;

                padding: 25px 28px 18px;
            }

        }

    </style>

</head>


<body>

    <main class="cadastro-card">


        <!-- LOGO -->

        <div class="logo-area">

            <img
                src="imagens/logo_belleza.png"
                alt="Logo Belleza"
                class="logo"
            >

            <h1>Belleza</h1>

            <p class="subtitulo">
                SALÃO DE BELEZA
            </p>

            <div class="linha"></div>

        </div>


        <!-- TÍTULO -->

        <h2 class="titulo">
            Criar conta
        </h2>

        <p class="descricao">
            Preencha os dados abaixo para criar sua conta.
        </p>


        <!-- FORMULÁRIO -->

        <form action="#" method="post">


            <!-- E-MAIL -->

            <div class="campo">

                <label for="email">
                    E-mail:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>


            <!-- TELEFONE -->

            <div class="campo">

                <label for="telefone">
                    Telefone:
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >

            </div>


            <!-- SENHA -->

            <div class="campo">

                <label for="senha">
                    Senha
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>


            <!-- CONFIRMAR SENHA -->

            <div class="campo">

                <label for="confirmar-senha">
                    Confirmar senha:
                </label>

                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    placeholder="Confirme sua senha"
                    required
                >

            </div>


            <!-- LEMBRAR-ME -->

            <div class="lembrar">

                <input
                    type="checkbox"
                    id="lembrar"
                    name="lembrar"
                >

                <label for="lembrar">
                    Lembrar-me
                </label>

            </div>


            <!-- BOTÃO -->

            <button
                type="submit"
                class="btn-criar">

                Criar conta

            </button>


            <!-- OU -->

            <div class="ou">
                ou
            </div>


            <!-- LOGIN -->
              <p class="login-existente">
            Já tem uma conta?
            <a href="login_cliente.html">
        Fazer login
            </a>
</p>
            </p>


        </form>

    </main>

</body>

</html>
