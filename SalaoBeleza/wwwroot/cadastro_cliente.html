<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Criar Conta - Belleza</title>

   <link rel="stylesheet"
        href="cadastro_cliente.css">

</head>

<body>

    <main class="cadastro-card">

        <div class="logo-area">

            <img
                src="imagens/logo_belleza.png"
                alt="Logo Belleza"
                class="logo"
            >

            <h1>Belleza</h1>

            <p class="subtitulo">
                SALÃO DE BELEZA
            </p>

            <div class="linha"></div>

        </div>

        <h2 class="titulo">
            Criar conta
        </h2>

        <p class="descricao">
            Preencha os dados abaixo para criar sua conta.
        </p>

        <form id="formCadastro">

            <div class="campo">

                <label for="nome">
                    Nome Completo:
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required
                >

            </div>

            <div class="campo">

                <label for="email">
                    E-mail:
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu e-mail"
                    required
                >

            </div>

            <div class="campo">

                <label for="telefone">
                    Telefone:
                </label>

                <input
                    type="tel"
                    id="telefone"
                    name="telefone"
                    placeholder="(00) 00000-0000"
                    required
                >

            </div>

            <div class="campo">

                <label for="senha">
                    Senha:
                </label>

                <input
                    type="password"
                    id="senha"
                    name="senha"
                    placeholder="Digite sua senha"
                    required
                >

            </div>

            <div class="campo">

                <label for="confirmar-senha">
                    Confirmar senha:
                </label>

                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    placeholder="Confirme sua senha"
                    required
                >

            </div>

            <div class="lembrar">

                <input
                    type="checkbox"
                    id="lembrar"
                    name="lembrar"
                >

                <label for="lembrar">
                    Lembrar-me
                </label>

            </div>

            <button
                type="submit"
                class="btn-criar">

                Criar conta

            </button>

            <div class="ou">
                ou
            </div>

            <p class="login-existente">

                Já tem uma conta?

                <a href="login_cliente.html">
                    Fazer login
                </a>

            </p>

        </form>

    </main>

    <script>

        const form =
            document.getElementById("formCadastro");


        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const nome =
                    document
                        .getElementById("nome")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const telefone =
                    document
                        .getElementById("telefone")
                        .value
                        .trim();


                const senha =
                    document
                        .getElementById("senha")
                        .value;


                const confirmarSenha =
                    document
                        .getElementById("confirmar-senha")
                        .value;


                if (nome === "") {

                    alert(
                        "Digite seu nome."
                    );

                    return;

                }


                if (email === "") {

                    alert(
                        "Digite seu e-mail."
                    );

                    return;

                }


                if (telefone === "") {

                    alert(
                        "Digite seu telefone."
                    );

                    return;

                }


                if (telefone.length < 11) {

                    alert(
                        "Digite um telefone válido."
                    );

                    return;

                }


                if (senha === "") {

                    alert(
                        "Digite uma senha."
                    );

                    return;

                }


                if (senha !== confirmarSenha) {

                    alert(
                        "As senhas não são iguais."
                    );

                    return;

                }


                try {

                    const resposta =
                        await fetch(
                            "/api/clientes",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        nome: nome,

                                        telefone:
                                            telefone,

                                        email: email,

                                        senha: senha,

                                        cpf: null

                                    })

                            }
                        );


                    if (!resposta.ok) {

                        const texto =
                            await resposta.text();

                        let mensagem =
                            "Não foi possível criar a conta.";

                        try {

                            const dados =
                                JSON.parse(texto);

                            if (dados.erro) {

                                mensagem =
                                    dados.erro;

                            }

                        }
                        catch {

                        }

                        alert(mensagem);

                        return;

                    }


                    alert(
                        "Conta criada com sucesso!"
                    );


                    window.location.href =
                        "login_cliente.html";

                }
                catch (erro) {

                    console.error(
                        "Erro:",
                        erro
                    );

                    alert(
                        "Não foi possível conectar com o servidor."
                    );

                }

            }
        );

    </script>

</body>

</html>
